<div class="page-x">
  <app-category-list
    [categories]="categories"
    [active]="activeCategory()"
    (changed)="selectCategory($event)"
  />

  @if (results(); as result) {
    @if (result.products.length) {
      <app-product-section [section]="result" (selected)="selectedProduct.set($event)" />
    } @else {
      <section class="grid place-items-center gap-3 py-20 text-center">
        <img [src]="emptyIcon" alt="" class="size-14 opacity-40" />
        <h2 class="text-xl font-semibold text-fk-ink">{{ result.title }}</h2>
        <p class="max-w-sm text-sm text-gray-500">
          We couldn't find anything matching your search. Try a different keyword or browse another
          category.
        </p>
        <button
          type="button"
          class="mt-2 rounded-md bg-[#1a6ef5] px-5 py-2.5 text-sm font-medium text-white hover:bg-fk-blue-dark"
          (click)="clearFilters()"
        >
          Back to home
        </button>
      </section>
    }
  } @else {
    <app-promotional-banner [banners]="banners" />

    @for (section of sections; track section.id) {
      <app-product-section [section]="section" (selected)="selectedProduct.set($event)" />
    }
  }
</div>

@if (selectedProduct(); as product) {
  <app-product-quick-view
    [product]="product"
    (closed)="selectedProduct.set(null)"
    (addToCart)="addToCart($event)"
    (buyNow)="buyNow($event)"
  />
}
