<nav aria-label="Shop by category" class="relative -mx-4 border-b border-gray-200 sm:-mx-6 xl:mx-0">
  <ul #scroller class="no-scrollbar flex items-stretch overflow-x-auto px-4 sm:px-6 xl:px-0" (scroll)="update()">
    @for (category of categories(); track category.id) {
      <li class="shrink-0">
        <button
          type="button"
          class="group relative flex min-w-[95.5px] flex-col items-center px-3 pb-[30px] pt-[26px] font-medium transition-colors focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-fk-blue"
          [class]="active() === category.id ? 'text-fk-blue' : 'text-[#212121] hover:text-fk-blue'"
          [attr.aria-current]="active() === category.id ? 'true' : null"
          (click)="changed.emit(category.id)"
        >
          <img [src]="category.icon" alt="" class="size-[30px] transition-transform duration-200 group-hover:-translate-y-0.5" />
          <span class="mt-3.5 whitespace-nowrap leading-4" [class]="category.label.length > 12 ? 'text-[11.5px]' : 'text-[13px]'">{{ category.label }}</span>
          <span
            class="absolute inset-x-3 bottom-0 h-[3px] rounded-t bg-fk-blue transition-opacity"
            [class]="active() === category.id ? 'opacity-100' : 'opacity-0 group-hover:opacity-40'"
          ></span>
        </button>
      </li>
    }
  </ul>

  <!-- Desktop arrows: only when the row is wider than the screen -->
  @if (canLeft()) {
    <button type="button" class="absolute left-1 top-1/2 hidden size-9 -translate-y-1/2 place-items-center rounded-full bg-white shadow-md ring-1 ring-black/5 hover:scale-105 md:grid" aria-label="Scroll categories left" (click)="scrollBy(-1)">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="#212121" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
  }
  @if (canRight()) {
    <button type="button" class="absolute right-1 top-1/2 hidden size-9 -translate-y-1/2 place-items-center rounded-full bg-white shadow-md ring-1 ring-black/5 hover:scale-105 md:grid" aria-label="Scroll categories right" (click)="scrollBy(1)">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="#212121" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  }
</nav>
